<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reseñas | La Fonda</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/resenas-styles.css">
</head>

<body>
    <div id="global-nav"></div>
    <main class="container" style="padding-top:120px;">
        <h1 class="hero-title">Lo que dicen <span class="highlight">nuestros clientes</span></h1>
        <section class="reviews-grid" id="reviews-grid">
            <div class="reviews-empty">Cargando reseñas publicadas...</div>
        </section>
        <section class="add-review" style="margin-top:80px;padding-bottom:50px;">
            <div class="login-card" style="max-width:600px;margin:0 auto;">
                <h2 style="text-align:center;margin-bottom:20px;">Deja tu <span class="highlight">Opinión</span></h2>
                <p style="color:var(--text-gray);text-align:center;margin-bottom:18px;">Solo podrás reseñar un pedido
                    pagado. La reseña quedará pendiente de aprobación.</p>
                <form class="auth-form" id="review-form">
                    <div class="input-group"><label>Pedido<select id="review-order" required>
                                <option value="">Inicia sesión para cargar tus pedidos</option>
                            </select></label></div>
                    <div class="input-group"><label>Tu experiencia<textarea id="review-text" rows="4"
                                placeholder="Cuéntanos qué tal estuvo la comida..." required></textarea></label></div>
                    <div class="input-group"><label>Calificación<select id="review-rating">
                                <option value="5">5 Estrellas - Excelente</option>
                                <option value="4">4 Estrellas - Muy Bueno</option>
                                <option value="3">3 Estrellas - Regular</option>
                                <option value="2">2 Estrellas</option>
                                <option value="1">1 Estrella</option>
                            </select></label></div>
                    <p id="review-status" style="min-height:20px;color:var(--text-gray);"></p>
                    <button type="submit" class="btn-order">ENVIAR RESEÑA</button>
                </form>
            </div>
        </section>
    </main>
    <div id="global-footer"></div>
    <script src="/scripts/config.js"></script>
    <script src="/scripts/db.js"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/load-layout.js"></script>
    <script src="/scripts/resenas.js"></script>
</body>

</html>
