<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | La Fonda</title>
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/registrarse.css">
</head>

<body>
    <div id="global-nav"></div>
    <main class="hero">
        <div class="container">
            <div class="login-card">
                <h2 class="hero-title" style="font-size:2.5rem;text-align:center;">Bienvenido</h2>
                <p style="text-align:center;color:var(--text-gray);margin-bottom:30px;">Ingresa con tu correo y
                    contraseña registrados en la base de datos.</p>
                <form class="auth-form" id="login-form">
                    <div class="input-group">
                        <label><input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email"
                                required>Correo Electrónico</label>
                    </div>
                    <div class="input-group">
                        <label><input type="password" id="login-password" placeholder="Mínimo 6 caracteres"
                                autocomplete="current-password" minlength="6" required>Contraseña</label>
                    </div>
                    <p id="login-status"
                        style="min-height:22px;color:var(--text-gray);font-size:.85rem;margin-bottom:12px;"></p>
                    <button type="submit" class="btn-order" style="width:100%;border:none;cursor:pointer;">Iniciar
                        Sesión</button>
                </form>
                <div class="form-footer">
                    <p>¿No tienes cuenta? <a href="registro-nuevo.html" class="highlight">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </main>
    <div id="global-footer"></div>
    <script src="/scripts/config.js"></script>
    <script src="/scripts/db.js"></script>
    <script src="/scripts/auth.js"></script>
    <script src="/scripts/load-layout.js"></script>
    <script src="/scripts/login.js"></script>
</body>

</html>
